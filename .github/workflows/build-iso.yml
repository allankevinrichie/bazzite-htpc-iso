name: Build Bazzite HTPC ISO
on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - disk-config.toml
      - 'rootfs/**'
      - 'scripts/**'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bazzite-iso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true
      - name: Build and verify checksum
        run: |
          df -h .
          ./scripts/build-iso.sh
          (cd output && sha256sum -c SHA256SUMS)
      - name: Upload ISO and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazzite-htpc-amd64
          path: |
            output/bazzite-htpc-amd64.iso
            output/SHA256SUMS
            output/build-info.txt
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
